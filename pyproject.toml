[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriloop"
version = "0.1.0"
description = "A minimal, testable local coding-agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[project.scripts]
veriloop = "veriloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
